name: 학교알리미 수집

on:
  schedule:
    # 매주 월요일 새벽 3시 17분(한국 시간)에 깨어나서, 3·6·9·11월 첫째 주 월요일일 때만 수집
    - cron: '17 18 * * 0'
  workflow_dispatch:
    inputs:
      sido:
        description: '시·도 코드 (비우면 전국). 예: 1200000000 = 전남광주'
        required: false
        default: ''
      level:
        description: '04 = 고등학교, 03 = 중학교'
        required: false
        default: '04'
      build_only:
        description: 'yes = 수집 없이 색인·평가표 묶음만 다시 만들기'
        required: false
        default: 'no'
      chain:
        description: '이어서 수집 횟수(자동으로 채워짐, 손대지 마세요)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.m.outputs.run }}
      matrix: ${{ steps.m.outputs.matrix }}
      level: ${{ steps.m.outputs.level }}
    steps:
      - id: m
        run: |
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            M=$(TZ=Asia/Seoul date +%-m); D=$(TZ=Asia/Seoul date +%-d)
            case "$M" in 3|6|9|11) [ "$D" -le 7 ] || RUN=false ;; *) RUN=false ;; esac
            echo "한국 날짜 ${M}월 ${D}일 → 수집 여부: $RUN"
          fi
          echo "run=$RUN" >> $GITHUB_OUTPUT
          ALL='["1100000000","1200000000","2600000000","2700000000","2800000000","3000000000","3100000000","3611000000","4100000000","4300000000","4400000000","4700000000","4800000000","5000000000","5100000000","5200000000"]'
          SIDO='${{ github.event.inputs.sido }}'
          if [ -n "$SIDO" ]; then echo "matrix=[\"$SIDO\"]" >> $GITHUB_OUTPUT; else echo "matrix=$ALL" >> $GITHUB_OUTPUT; fi
          LV='${{ github.event.inputs.level }}'
          echo "level=${LV:-04}" >> $GITHUB_OUTPUT

  collect:
    needs: plan
    if: needs.plan.outputs.run == 'true' && github.event.inputs.build_only != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        sido: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 수집
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node collector/collect.js --sido ${{ matrix.sido }} --level ${{ needs.plan.outputs.level }} --budget 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.sido }}-${{ needs.plan.outputs.level }}
          path: |
            docs/data/raw/${{ matrix.sido }}-${{ needs.plan.outputs.level }}.json.gz
            docs/data/raw/${{ matrix.sido }}-${{ needs.plan.outputs.level }}.pending
            docs/data/details/${{ matrix.sido }}-${{ needs.plan.outputs.level }}/
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: [plan, collect]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: raw-*
          path: docs/data
          merge-multiple: true
      - name: 색인 만들기
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node collector/build.js
      - name: 이어서 할 시·도 확인
        id: pend
        run: |
          P=$(ls docs/data/raw/*.pending 2>/dev/null | wc -l)
          echo "남은 시·도: $P"; ls docs/data/raw/*.pending 2>/dev/null || true
          echo "count=$P" >> $GITHUB_OUTPUT
          rm -f docs/data/raw/*.pending
      - name: 저장소에 올리기
        run: |
          git config user.name "suhaeng-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "바뀐 자료 없음"; exit 0; fi
          git commit -m "자료 갱신 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: 덜 끝난 곳은 자동으로 이어서 수집(최대 8번)
        if: steps.pend.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHAIN=${{ github.event.inputs.chain || '0' }}
          if [ "$CHAIN" -ge 8 ]; then echo "이어서 수집 횟수 한도에 닿았습니다"; exit 0; fi
          gh workflow run collect.yml --ref ${{ github.ref_name }} -f sido='${{ github.event.inputs.sido }}' -f level='${{ needs.plan.outputs.level }}' -f chain=$((CHAIN+1))
          echo "이어서 수집을 예약했습니다 ($((CHAIN+1))번째)"
